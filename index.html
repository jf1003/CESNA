<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CESNa - Registre des Présences</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .badge-p { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-m { background-color: #fef9c3; color: #a16207; border: 1px solid #fde047; }
    .badge-r { background-color: #ffedd5; color: #c2410c; border: 1px solid #fdba74; }
    .badge-a { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-t { background-color: #e0e7ff; color: #4338ca; border: 1px solid #a5b4fc; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- EN-TÊTE -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- LOGO & TITRE -->
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 bg-indigo-700 text-white rounded-lg flex items-center justify-center font-bold text-lg tracking-wider shadow">
          CESNa
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">Registre des Présences</h1>
          <p class="text-xs text-slate-500">Promotion Sociale & Formation Continue</p>
        </div>
      </div>

      <!-- SÉLECTEUR DE COURS & STATUS FIRESTORE -->
      <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg">
        <label for="selectCours" class="text-xs font-semibold text-slate-600">Cours :</label>
        <select id="selectCours" class="bg-white border border-slate-300 rounded px-2 py-1 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <!-- Rempli dynamiquement -->
        </select>
        <button id="btnNouveauCours" title="Ajouter un cours" class="px-2 py-1 bg-indigo-50 text-indigo-700 border border-indigo-200 rounded text-xs font-semibold hover:bg-indigo-100 transition">
          + Nouveau cours
        </button>
        <div id="cloudStatus" class="flex items-center gap-1 text-xs text-slate-500 pl-2 border-l border-slate-200">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span>Connexion Cloud...</span>
        </div>
      </div>

      <!-- ACTIONS SECONDAIRES -->
      <div class="flex items-center gap-2">
        <button id="btnExportExcel" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs font-semibold hover:bg-emerald-700 transition shadow-sm flex items-center gap-1.5">
          <span>📊 Exporter Excel</span>
        </button>
      </div>

    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="max-w-7xl mx-auto p-6 flex-1 w-full space-y-6">

    <!-- BARRE D'OUTILS SEANCES ET GESTION -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-sm font-semibold text-slate-700">Séances :</span>
        <button id="btnAjouterSeance" class="px-3 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-md hover:bg-indigo-700 transition">
          + Ajouter une séance
        </button>
        <button id="btnGenererDates" class="px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-200 text-xs font-semibold rounded-md hover:bg-slate-200 transition">
          🗓️ Planifier dates
        </button>
      </div>
      <div class="flex items-center gap-3">
        <button id="btnGererEtudiants" class="px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-200 text-xs font-semibold rounded-md hover:bg-slate-200 transition">
          👥 Liste des étudiants (<span id="countEtudiants">0</span>)
        </button>
      </div>
    </div>

    <!-- TABLEAU DE POINTAGE -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-600">
              <th class="p-3 w-12 text-center">#</th>
              <th class="p-3 min-w-[200px]">Nom et Prénom</th>
              <th id="datesHeaderContainer" class="p-0">
                <!-- Colonnes de dates injectées dynamiquement -->
              </th>
              <th class="p-3 w-28 text-center bg-slate-100/70">Présence %</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-100">
            <!-- Lignes des étudiants injectées ici -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- MODAL: GESTION DES ETUDIANTS -->
  <div id="modalEtudiants" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl">
      <h3 class="text-base font-bold text-slate-900">Modifier la liste des étudiants</h3>
      <p class="text-xs text-slate-500">Collez ou tapez un nom par ligne (ex. : Dupont Jean).</p>
      <textarea id="txtEtudiants" rows="10" class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-mono"></textarea>
      <div class="flex justify-end gap-2 pt-2">
        <button id="btnFermerModalEtudiants" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-200">Annuler</button>
        <button id="btnSauverEtudiants" class="px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-lg hover:bg-indigo-700">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS (SDK v10 en modules CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB4vOtLTopCxefpH-duBHk_jfXwZvvsVnI",
      authDomain: "cesna-presences.firebaseapp.com",
      projectId: "cesna-presences",
      storageBucket: "cesna-presences.firebasestorage.app",
      messagingSenderId: "162301242616",
      appId: "1:162301242616:web:03b52bafb3ac7deedc9f0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ETAT DE L'APPLICATION
    let coursActif = new URLSearchParams(window.location.search).get('cours') || 'cours-defaut';
    let registre = {
      etudiants: ["Exemple Étudiant 1", "Exemple Étudiant 2"],
      seances: ["Séance 1"],
      pointages: {}
    };
    let unsubscribeFirestore = null;

    const cloudStatus = document.getElementById("cloudStatus");
    const selectCours = document.getElementById("selectCours");

    function majStatutCloud(type, texte) {
      const couleur = type === 'ok' ? 'bg-emerald-500' : type === 'sync' ? 'bg-amber-400' : 'bg-rose-500';
      cloudStatus.innerHTML = `<span class="w-2 h-2 rounded-full ${couleur}"></span><span>${texte}</span>`;
    }

    // CHARGER UN COURS DEPUIS FIRESTORE EN TEMPS RÉEL
    function connecterCours(coursId) {
      if (unsubscribeFirestore) unsubscribeFirestore();
      majStatutCloud('sync', 'Connexion...');

      const coursRef = doc(db, "cours", coursId);

      unsubscribeFirestore = onSnapshot(coursRef, (docSnap) => {
        if (docSnap.exists()) {
          registre = docSnap.data();
        } else {
          // Initialisation si le cours est neuf
          registre = {
            etudiants: ["Dupont Jean", "Martin Sophie"],
            seances: ["Séance 1"],
            pointages: {}
          };
          setDoc(coursRef, registre);
        }
        majStatutCloud('ok', 'En direct Cloud');
        renderTable();
      }, (error) => {
        console.error(error);
        majStatutCloud('error', 'Erreur Cloud');
      });
    }

    // SAUVEGARDE DIRECTE
    async function sauvegarderCloud() {
      majStatutCloud('sync', 'Enregistrement...');
      try {
        const coursRef = doc(db, "cours", coursActif);
        await setDoc(coursRef, registre);
        majStatutCloud('ok', 'En direct Cloud');
      } catch (e) {
        console.error(e);
        majStatutCloud('error', 'Erreur sauvegarde');
      }
    }

    // RENDU DU TABLEAU
    function renderTable() {
      document.getElementById("countEtudiants").innerText = (registre.etudiants || []).length;

      // Header des séances
      const datesContainer = document.getElementById("datesHeaderContainer");
      let headerHtml = `<div class="flex">`;
      (registre.seances || []).forEach((s, idx) => {
        headerHtml += `<div class="p-3 text-center border-l border-slate-200 min-w-[100px] flex-1 font-semibold">${s}</div>`;
      });
      headerHtml += `</div>`;
      datesContainer.innerHTML = headerHtml;

      // Lignes des étudiants
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      (registre.etudiants || []).forEach((etudiant, etuIdx) => {
        let totalValides = 0;
        let totalPresents = 0;

        let rowHtml = `<tr class="hover:bg-slate-50 transition">
          <td class="p-3 text-center text-xs text-slate-400 font-mono">${etuIdx + 1}</td>
          <td class="p-3 font-medium text-slate-800">${etudiant}</td>
          <td class="p-0"><div class="flex">`;

        (registre.seances || []).forEach((s, sIdx) => {
          const key = `${etudiant}_${sIdx}`;
          const val = (registre.pointages && registre.pointages[key]) || 'P';

          if (val === 'P') { totalPresents += 1; totalValides += 1; }
          else if (val === 'M') { totalValides += 1; }
          else if (val === 'R') { totalPresents += 0.8; totalValides += 1; }
          else if (val === 'A') { totalValides += 1; }
          // 'T' ne compte pas dans le dénominateur

          const badgeClasses = {
            'P': 'badge-p', 'M': 'badge-m', 'R': 'badge-r', 'A': 'badge-a', 'T': 'badge-t'
          }[val] || 'badge-p';

          rowHtml += `
            <div class="p-2 text-center border-l border-slate-100 min-w-[100px] flex-1 flex justify-center items-center">
              <button data-key="${key}" class="btn-pointage w-9 h-8 rounded font-bold text-xs shadow-sm transition ${badgeClasses}">
                ${val}
              </button>
            </div>`;
        });

        const pct = totalValides > 0 ? Math.round((totalPresents / totalValides) * 100) : 100;
        const colorPct = pct >= 80 ? 'text-emerald-600' : pct >= 50 ? 'text-amber-600' : 'text-rose-600';

        rowHtml += `</div></td>
          <td class="p-3 text-center font-bold text-sm bg-slate-50/50 ${colorPct}">${pct}%</td>
        </tr>`;

        tbody.innerHTML += rowHtml;
      });

      // Actions sur les clics de boutons de pointage
      document.querySelectorAll(".btn-pointage").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-key");
          const ordres = ['P', 'R', 'M', 'A', 'T'];
          const actuel = (registre.pointages && registre.pointages[key]) || 'P';
          const prochain = ordres[(ordres.indexOf(actuel) + 1) % ordres.length];

          if (!registre.pointages) registre.pointages = {};
          registre.pointages[key] = prochain;
          renderTable();
          sauvegarderCloud();
        });
      });
    }

    // GESTION DU SÉLECTEUR DE COURS
    function initCoursSelector() {
      const coursConnus = ['cours-defaut', 'math-bloc1', 'informatique-bloc2', 'anglais-soir'];
      if (!coursConnus.includes(coursActif)) coursConnus.push(coursActif);

      selectCours.innerHTML = coursConnus.map(c => 
        `<option value="${c}" ${c === coursActif ? 'selected' : ''}>${c}</option>`
      ).join('');

      selectCours.addEventListener("change", (e) => {
        coursActif = e.target.value;
        const url = new URL(window.location);
        url.searchParams.set('cours', coursActif);
        window.history.pushState({}, '', url);
        connecterCours(coursActif);
      });

      document.getElementById("btnNouveauCours").addEventListener("click", () => {
        const nom = prompt("Nom du nouveau cours (ex. compta-soir) :");
        if (nom) {
          const id = nom.toLowerCase().replace(/[^a-z0-9]/g, '-');
          coursActif = id;
          initCoursSelector();
          connecterCours(coursActif);
        }
      });
    }

    // AJOUT DE SÉANCE
    document.getElementById("btnAjouterSeance").addEventListener("click", () => {
      const nom = `Séance ${(registre.seances || []).length + 1}`;
      if (!registre.seances) registre.seances = [];
      registre.seances.push(nom);
      renderTable();
      sauvegarderCloud();
    });

    // MODAL ETUDIANTS
    const modalEtu = document.getElementById("modalEtudiants");
    document.getElementById("btnGererEtudiants").addEventListener("click", () => {
      document.getElementById("txtEtudiants").value = (registre.etudiants || []).join('\n');
      modalEtu.classList.remove("hidden");
      modalEtu.classList.add("flex");
    });
    document.getElementById("btnFermerModalEtudiants").addEventListener("click", () => {
      modalEtu.classList.add("hidden");
      modalEtu.classList.remove("flex");
    });
    document.getElementById("btnSauverEtudiants").addEventListener("click", () => {
      const raw = document.getElementById("txtEtudiants").value;
      registre.etudiants = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      modalEtu.classList.add("hidden");
      modalEtu.classList.remove("flex");
      renderTable();
      sauvegarderCloud();
    });

    // EXPORT EXCEL
    document.getElementById("btnExportExcel").addEventListener("click", () => {
      const data = (registre.etudiants || []).map(etu => {
        const row = { "Étudiant": etu };
        (registre.seances || []).forEach((s, idx) => {
          row[s] = (registre.pointages && registre.pointages[`${etu}_${idx}`]) || 'P';
        });
        return row;
      });
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Présences");
      XLSX.writeFile(wb, `CESNa_${coursActif}.xlsx`);
    });

    // DÉMARRAGE
    initCoursSelector();
    connecterCours(coursActif);
  </script>
</body>
</html>
